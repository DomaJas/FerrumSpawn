<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карта магазинов</title><style>
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:#1b1d23;color:#eee;font-family:system-ui,sans-serif}
#top{position:fixed;top:0;left:0;right:0;height:56px;z-index:5;padding:8px 10px;background:#23262e;display:flex;gap:8px;box-shadow:0 2px 8px #0008}
#q{flex:1;padding:0 14px;border-radius:8px;border:1px solid #444;background:#15171c;color:#fff;font-size:16px}
#x{width:44px;border:0;border-radius:8px;background:#3a3f4b;color:#fff;font-size:18px;cursor:pointer}
#res{position:fixed;top:62px;left:10px;width:min(440px,calc(100% - 20px));max-height:55vh;overflow:auto;background:#23262e;border-radius:8px;display:none;z-index:5;box-shadow:0 4px 16px #000a}
.r{padding:10px 12px;border-bottom:1px solid #333;cursor:pointer}.r:hover{background:#2e323d}
#view{position:absolute;inset:0;touch-action:none;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#map{display:block;image-rendering:pixelated}
#svg{position:absolute;left:0;top:0}
.shop{fill:rgba(255,255,255,.01);stroke:transparent;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}
.shop:hover{fill:rgba(255,215,0,.3);stroke:gold}
.shop.hit{stroke:#4f8;fill:rgba(80,255,120,.4);animation:p .8s infinite alternate}
@keyframes p{to{fill:rgba(80,255,120,.8)}}
#panel{position:fixed;right:10px;top:66px;width:340px;max-height:calc(100% - 80px);overflow:auto;background:#23262e;border-radius:10px;padding:14px;z-index:4;display:none;box-shadow:0 4px 16px #000a}
#panel h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;gap:8px}
#panel h2 span{cursor:pointer;color:#aaa}
.it{display:flex;align-items:center;gap:10px;padding:6px;border-radius:6px}.it.m{background:#2c4a35}
.ic{width:32px;height:32px;image-rendering:pixelated;flex:none}.pr .ic{width:20px;height:20px;vertical-align:middle}
.it .t{flex:1}.e{color:#c9a0ff;font-size:13px;font-style:italic}.pr{white-space:nowrap;font-weight:600}
.rr{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:4px}.rr .ic{width:20px;height:20px}
@media(max-width:700px){#panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:55vh;border-radius:12px 12px 0 0}}
</style></head><body>
<div id="top"><input id="q" placeholder="Поиск предмета: что и где продаётся…" autocomplete="off"><button id="x">✕</button></div>

const $=s=>document.querySelector(s);
const view=$('#view'),world=$('#world'),svg=$('#svg'),panel=$('#panel'),q=$('#q'),res=$('#res');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#map').src=D.map;
world.style.width=D.w+'px';world.style.height=D.h+'px';
svg.setAttribute('viewBox','0 0 '+D.w+' '+D.h);svg.setAttribute('width',D.w);svg.setAttribute('height',D.h);
let sc=1,tx=0,ty=0;
const apply=()=>world.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
function fit(){sc=Math.min(innerWidth/D.w,(innerHeight-56)/D.h);tx=(innerWidth-D.w*sc)/2;ty=56+(innerHeight-56-D.h*sc)/2;apply()}
function zoomAt(x,y,k){const n=Math.min(8,Math.max(.1,sc*k));k=n/sc;tx=x-(x-tx)*k;ty=y-(y-ty)*k;sc=n;apply()}
view.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)},{passive:false});
const ptr=new Map();let moved=false,start=[0,0],pd=0;
const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
view.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==1){moved=false;start=[e.clientX,e.clientY]}else pd=dist()});
addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);
  if(Math.hypot(e.clientX-start[0],e.clientY-start[1])>5)moved=true;
  if(ptr.size==1){tx+=e.clientX-o[0];ty+=e.clientY-o[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);apply()}
  else{ptr.set(e.pointerId,[e.clientX,e.clientY]);const a=[...ptr.values()],d=dist();
    zoomAt((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2,d/pd);pd=d}
});
['pointerup','pointercancel'].forEach(t=>addEventListener(t,e=>ptr.delete(e.pointerId)));

const icon=(k,c)=>'<img class="'+(c||'ic')+'" src="'+(D.icons[k]||'')+'">';
const price=it=>it.p+' '+icon(it.c=='dia'?'$dia':'$ore');
const match=(it,t)=>(it.l+' '+it.i.replace(/_/g,' ')+' '+(it.e||'')).toLowerCase().includes(t);
const polys=D.shops.map((s,i)=>{
  const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');
  p.setAttribute('points',s.p.map(a=>a.join(',')).join(' '));p.setAttribute('class','shop');
  p.addEventListener('click',()=>{if(!moved)openShop(i,q.value.trim().toLowerCase())});
  svg.appendChild(p);return p});

function openShop(i,t){
  const s=D.shops[i];
  panel.innerHTML='<h2><b>'+esc(s.n)+'</b><span id="cl">✕</span></h2>'+
   (s.items.length?s.items.map(it=>'<div class="it'+(t&&match(it,t)?' m':'')+'">'+icon(it.i)+
     '<div class="t">'+esc(it.l)+(it.e?'<div class="e">'+esc(it.e)+'</div>':'')+'</div><div class="pr">'+price(it)+'</div></div>').join(''):'<i>Товаров пока нет</i>');
  panel.style.display='block';$('#cl').onclick=()=>panel.style.display='none';
}
function flyTo(i){
  const xs=D.shops[i].p.map(a=>a[0]),ys=D.shops[i].p.map(a=>a[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
  const z=Math.min(4,Math.max(sc,1.5));
  world.style.transition='transform .4s';sc=z;tx=innerWidth/2-cx*z;ty=(innerHeight+56)/2-cy*z;apply();
  setTimeout(()=>world.style.transition='',450);
}
function search(){
  const t=q.value.trim().toLowerCase();let h='';
  polys.forEach((p,i)=>{
    const m=t?D.shops[i].items.filter(it=>match(it,t)):[];
    p.classList.toggle('hit',m.length>0);
    if(m.length)h+='<div class="r" data-i="'+i+'"><b>'+esc(D.shops[i].n)+'</b>'+
      m.map(it=>'<div class="rr">'+icon(it.i)+esc(it.l)+(it.e?' <span class="e">'+esc(it.e)+'</span>':'')+
      ' — <span class="pr">'+price(it)+'</span></div>').join('')+'</div>';
  });
  res.innerHTML=h||(t?'<div class="r">Ничего не найдено</div>':'');res.style.display=t?'block':'none';
}
res.addEventListener('click',e=>{const r=e.target.closest('[data-i]');if(r){const i=+r.dataset.i;flyTo(i);openShop(i,q.value.trim().toLowerCase())}});
q.addEventListener('input',search);
$('#x').onclick=()=>{q.value='';search();panel.style.display='none'};
addEventListener('keydown',e=>{if(e.key=='Escape')$('#x').click()});
addEventListener('resize',fit);fit();
</script></body></html>
